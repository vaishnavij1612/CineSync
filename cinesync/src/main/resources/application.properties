spring.application.name=cinesync
server.port=${PORT:8080}
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinesync_dev?options=-c%20TimeZone=UTC}
spring.datasource.username=${DB_USERNAME:cinesync_user}
spring.datasource.password=${DB_PASSWORD:cinesync_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─────────────────────────────────────────────────────────────────
# External API Configuration
# Set TMDB_API_KEY environment variable to enable movie discovery.
# Weather (Open-Meteo) and Geocoding (Nominatim) require no API key.
# ─────────────────────────────────────────────────────────────────

# TMDB (The Movie Database) – set TMDB_API_KEY environment variable
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500

# Open-Meteo weather API (no key required)
weather.base-url=https://api.open-meteo.com/v1

# Nominatim geocoding API (no key required)
geocoding.base-url=https://nominatim.openstreetmap.org

# External HTTP client timeouts (milliseconds)
external.api.connect-timeout-ms=5000
external.api.read-timeout-ms=8000