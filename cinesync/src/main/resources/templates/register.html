<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CineSync</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <div class="site-header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">C</span>
            <span>CineSync</span>
        </a>
        <nav class="nav">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a class="nav-link" th:href="@{/login}">Login</a>
            <a class="nav-link active" th:href="@{/register}">Register</a>
        </nav>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h1>Create your CineSync account</h1>
        <p class="auth-subtitle">Start discovering movies made for your mood.</p>

        <p th:if="${registrationError}" class="alert" th:text="${registrationError}" role="alert"></p>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="field">
                <label for="username">Username</label>
                <input class="input" id="username" th:field="*{username}" autocomplete="username">
                <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input class="input" id="email" type="email" th:field="*{email}" autocomplete="email">
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="field">
                <label for="fullName">Full name</label>
                <input class="input" id="fullName" th:field="*{fullName}" autocomplete="name">
                <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input class="input" id="password" type="password" th:field="*{password}" autocomplete="new-password">
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Register</button>
            </div>
        </form>

        <p class="auth-meta">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    </section>
</main>
</body>
</html>
