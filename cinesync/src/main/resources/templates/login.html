<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CineSync</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <div class="site-header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">C</span>
            <span>CineSync</span>
        </a>
        <nav class="nav">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a class="nav-link active" th:href="@{/login}">Login</a>
            <a class="nav-link" th:href="@{/register}">Register</a>
        </nav>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Sign in to keep discovering movies and shows that fit your style.</p>

        <p th:if="${param.registered}" class="alert alert-success" role="alert">Registration complete. You can sign in now.</p>
        <p th:if="${param.error}" class="alert alert-error" role="alert">Invalid username or password.</p>
        <p th:if="${param.logout}" class="alert alert-neutral" role="alert">You have been signed out successfully.</p>

        <form th:action="@{/login}" method="post" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="field">
                <label for="username">Username</label>
                <input class="input" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input class="input" id="password" type="password" name="password" autocomplete="current-password" required>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Sign In</button>
            </div>
        </form>

        <p class="auth-meta">Don't have an account? <a th:href="@{/register}">Create one</a></p>
    </section>
</main>
</body>
</html>
